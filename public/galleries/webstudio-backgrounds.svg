  <line x1="40" y1="232" x2="600" y2="232" stroke="#1E1B18" stroke-opacity="0.12" />
  <text x="40" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8A857C">webstudio-backgrounds.vercel.app — original work, free to reuse at the source</text>
