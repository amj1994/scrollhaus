<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="131 Website Templates">
  <!--
    A hand-authored card, not a screenshot. Two reasons:
    1. This section links to OTHER PEOPLE's directories of OTHER PEOPLE's
       templates (see data/galleries.ts) — a screenshot of the target's own
       page is a step closer to reproducing content that isn't ours to copy
       than a plain typographic card referencing it by name is.
    2. This repo's GitHub push path only transports text content; a binary
       asset (webp/png) written through it lands corrupted (confirmed: the
       file arrives as literal base64 text, not decoded bytes). SVG is text,
       so it survives the same push path that mangles raster images.
    Palette lifted from the target's own stated tokens (cream / terracotta /
    ink) as a factual reference to their brand, not a copy of their layout.
  -->
  <rect width="640" height="280" fill="#F4F3EE" />
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#C15F3C">131 TEMPLATES · ANY AI CODING TOOL</text>
  <text x="40" y="118" font-family="Georgia, serif" font-size="44" fill="#1E1B18">131 website templates.</text>
  <text x="40" y="168" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#C15F3C">Build them anywhere.</text>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#8A857C">
    <text x="40" y="220">131 TEMPLATES</text>
    <text x="220" y="220">9 CATEGORIES</text>
    <text x="380" y="220">FREE TO REMIX</text>
  </g>
  <line x1="40" y1="236" x2="600" y2="236" stroke="#1E1B18" stroke-opacity="0.12" />
  <text x="40" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8A857C">lovable-templates.vercel.app — an independent, unaffiliated directory</text>
</svg>
